version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: shop33
      POSTGRES_PASSWORD: shop33
      POSTGRES_DB: shop33
    ports:
      - "5432:5432"
    volumes:
      - shop33_pg_data:/var/lib/postgresql/data

volumes:
  shop33_pg_data:

