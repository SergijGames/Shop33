services:
  # Shop33 API (Node/Express)
  - type: web
    name: shop33-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm ci && npx prisma generate && npx prisma db push
    startCommand: node index.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 4242
      - key: DATABASE_URL
        fromDatabase:
          name: shop33-db
          property: connectionString
      # Set manually in Render dashboard (do NOT commit secrets):
      # - JWT_SECRET
      # - SEED_ADMIN_EMAIL / SEED_ADMIN_PASSWORD / SEED_ADMIN_NAME
      # - STRIPE_SECRET_KEY
      # - LIQPAY_PUBLIC_KEY / LIQPAY_PRIVATE_KEY

databases:
  - name: shop33-db
    plan: free
    region: frankfurt
